<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar Código Ativador</title>
  <style>
    :root {
      --blue: #2777ff;
      --purple: #b440f2;
      --surface: #0b0c10;
      --surface-2: #13151c;
      --line: #454750;
      --muted: #b8b8c0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 72px 24px;
      color: #fff;
      background: #000;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
    }

    main { width: min(100%, 768px); }

    .intro { text-align: center; margin-bottom: 34px; }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 28px;
      font-size: 95px;
      line-height: .55;
      font-weight: 700;
      letter-spacing: -13px;
      color: transparent;
      background: linear-gradient(115deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 26px rgba(97, 74, 255, .24);
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(3, 13px);
      gap: 12px;
      transform: translateY(5px);
      letter-spacing: 0;
    }

    .dots i {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    h1 { margin: 0; font-size: clamp(34px, 5vw, 51px); letter-spacing: -1.8px; }
    .subtitle { margin: 14px 0 0; color: #adadb5; font-size: clamp(21px, 3vw, 30px); }

    .card {
      border: 1px solid var(--line);
      border-radius: 34px;
      background: radial-gradient(circle at 50% -45%, #242735 0, var(--surface) 48%, #08090b 100%);
      box-shadow: inset 0 1px rgba(255,255,255,.05), 0 22px 60px rgba(0,0,0,.3);
    }

    .entry { padding: 54px 60px 58px; }
    .instruction { margin: 0 0 42px; text-align: center; color: #d4d4da; font-size: clamp(19px, 2.8vw, 28px); }

    .code-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }

    .digit {
      width: 100%;
      min-width: 0;
      aspect-ratio: 1;
      border: 1px solid #565963;
      border-radius: 22px;
      outline: none;
      color: #fff;
      background: linear-gradient(145deg, #15171b, #070808);
      font: inherit;
      font-size: clamp(38px, 7vw, 65px);
      text-align: center;
      caret-color: #a14cff;
      transition: border-color .18s, box-shadow .18s, transform .18s;
    }

    .digit:focus {
      border-color: #8b64ff;
      box-shadow: 0 0 0 3px rgba(111, 80, 255, .18), 0 0 22px rgba(107, 72, 255, .23);
      transform: translateY(-2px);
    }

    .generate {
      width: 100%;
      margin-top: 45px;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 20px;
      padding: 22px 18px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(105deg, #126cff, #ab3be9);
      box-shadow: 0 8px 26px rgba(106, 55, 255, .32), inset 0 1px rgba(255,255,255,.28);
      font: inherit;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 800;
      transition: filter .2s, transform .2s;
    }

    .generate:hover, .copy:hover { filter: brightness(1.12); }
    .generate:active, .copy:active { transform: scale(.985); }

    .result {
      display: none;
      margin-top: 28px;
      padding: 42px 30px 40px;
      text-align: center;
    }

    .result.show { display: block; animation: show .26s ease-out; }
    @keyframes show { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .check {
      width: 65px;
      height: 65px;
      margin: 0 auto 26px;
      border: 2px solid #9c59ff;
      border-left-color: #2581ff;
      border-bottom-color: #2581ff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 39px;
      font-weight: 300;
      color: #6789ff;
      transform: rotate(-8deg);
    }

    .result-label { margin: 0; color: var(--muted); font-size: clamp(15px, 2vw, 22px); font-weight: 650; letter-spacing: 2.3px; }
    .answer {
      margin: 19px 0 23px;
      font-size: clamp(58px, 11vw, 105px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 4px;
      color: transparent;
      background: linear-gradient(100deg, #207bff, #be40ee);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .copy {
      border: 1px solid #a4a4aa;
      border-radius: 17px;
      padding: 17px 29px;
      cursor: pointer;
      color: white;
      background: transparent;
      font: inherit;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .copy span { color: #5276ff; margin-right: 12px; font-size: 27px; }
    .notice { min-height: 22px; margin: 16px 0 0; color: #aaa; font-size: 15px; }

    @media (max-width: 540px) {
      body { padding: 48px 18px; }
      .brand-mark { font-size: 78px; }
      .entry { padding: 38px 22px 32px; }
      .code-inputs { gap: 12px; }
      .digit { border-radius: 16px; }
      .card { border-radius: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="title">
      <div class="brand-mark" aria-hidden="true">#<span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      <h1 id="title">Gerar Código Ativador</h1>
      <p class="subtitle">Unitv Free</p>
    </section>

    <section class="card entry" aria-label="Gerador de código">
      <p class="instruction">Digite os 4 números exibidos na TV</p>
      <div class="code-inputs">
        <input class="digit" inputmode="numeric" maxlength="1" aria-label="Primeiro número">
        <input class="digit" inputmode="numeric" maxlength="1" aria-label="Segundo número">
        <input class="digit" inputmode="numeric" maxlength="1" aria-label="Terceiro número">
        <input class="digit" inputmode="numeric" maxlength="1" aria-label="Quarto número">
      </div>
      <button class="generate" type="button">GERAR CÓDIGO</button>
      <p class="notice" id="notice" role="alert"></p>
    </section>

    <section class="card result" id="result" aria-live="polite">
      <div class="check">✓</div>
      <p class="result-label">SEU CÓDIGO DE ATIVAÇÃO</p>
      <p class="answer" id="answer">000000</p>
      <button class="copy" type="button" id="copy"><span>▣</span>COPIAR</button>
    </section>
  </main>

  <script>
    const fields = [...document.querySelectorAll('.digit')];
    const notice = document.querySelector('#notice');
    const result = document.querySelector('#result');
    const answer = document.querySelector('#answer');

    fields.forEach((field, index) => {
      field.addEventListener('input', () => {
        field.value = field.value.replace(/\D/g, '').slice(0, 1);
        if (field.value && index < fields.length - 1) fields[index + 1].focus();
      });
      field.addEventListener('keydown', event => {
        if (event.key === 'Backspace' && !field.value && index > 0) fields[index - 1].focus();
      });
      field.addEventListener('paste', event => {
        const digits = event.clipboardData.getData('text').replace(/\D/g, '').slice(0, 4);
        if (!digits) return;
        event.preventDefault();
        digits.split('').forEach((digit, i) => { if (fields[index + i]) fields[index + i].value = digit; });
        fields[Math.min(index + digits.length, 3)].focus();
      });
    });

    function generateCode(value) {
      let n = Number.parseInt(value, 10);
      const key = 918273645;
      n = n * 7919;
      n += key;
      n = (n | 0) ^ 0x5A5A;
      n = n * 97;
      n += 654321;
      n = (n | 0) ^ (key >> 8);
      n = n * 37;
      n += 123456;
      n = (n | 0) ^ 0xA3F2;
      n = n * 43;
      return String(Math.abs(n) % 1000000).padStart(6, '0');
    }

    document.querySelector('.generate').addEventListener('click', () => {
      const input = fields.map(field => field.value).join('');
      if (input.length !== 4) {
        notice.textContent = 'Digite os 4 números para gerar o código.';
        fields.find(field => !field.value)?.focus();
        return;
      }
      notice.textContent = '';
      answer.textContent = generateCode(input);
      result.classList.add('show');
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.querySelector('#copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(answer.textContent);
        notice.textContent = 'Código copiado.';
      } catch {
        notice.textContent = 'Não foi possível copiar automaticamente.';
      }
    });
  </script>
</body>
</html>
