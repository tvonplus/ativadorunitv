<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1f2937;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,.5);
            max-width: 350px;
            width: 90%;
        }
        h2 { color: #3b82f6; margin-top: 0; }
        input[type="number"] {
            width: 80%;
            padding: 12px;
            font-size: 22px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #374151;
            background: #111827;
            color: #fff;
            margin: 15px 0;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 90%;
        }
        .resultado {
            margin-top: 20px;
            font-size: 18px;
            color: #d1d5db;
        }
        .senha-gerada {
            font-size: 40px;
            font-weight: bold;
            color: #22c55e;
            letter-spacing: 4px;
            background: #111827;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Painel do Administrador</h2>
    <p>Digite o código que aparece na TV do cliente:</p>
    
    <input type="number" id="codigoTV" placeholder="Ex: 7482" maxlength="4">
    <button onclick="gerarResposta()">⚡ Gerar Senha</button>

    <div class="resultado" id="areaResultado" style="display:none;">
        <p>Envie esta senha ao cliente:</p>
        <div class="senha-gerada" id="senhaCalculada">----</div>
    </div>
</div>

<script>
    // A MESMA CHAVE SECRETA DO INDEX.HTML
    const CHAVE_SECRETA = 3579;

    function gerarResposta() {
        const codigoTV = parseInt(document.getElementById('codigoTV').value);

        if (!codigoTV || codigoTV < 1000 || codigoTV > 9999) {
            alert("Digite um código válido de 4 dígitos!");
            return;
        }

        // Aplica a mesma conta matemática
        const resposta = (codigoTV * 3 + CHAVE_SECRETA) % 10000;
        const respostaFormatada = String(resposta).padStart(4, '0');

        document.getElementById('senhaCalculada').innerText = respostaFormatada;
        document.getElementById('areaResultado').style.display = 'block';
    }
</script>

</body>
</html>
