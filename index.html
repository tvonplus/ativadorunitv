<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;

        .box {
            background: #1f2937;

        h2 {
            color: #3b82f6;
            margin-top: 0;

        p {
            font-size: 12px;

        input[type="number"] {
            width: 80%;

            font-size: 16px;

            border-radius: 4px;
            border: 1px solid #374151;

            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;

            padding: 6px 12px;

            width: 90%;
        }

        .resultado {
            margin-top: 10px;
            font-size: 12px;
            color: #d1d5db;
        }

        .senha-gerada {
            font-size: 20px;
            font-weight: bold;
            color: #22c55e;
            letter-spacing: 2px;
            background: #111827;
            padding: 5px;
            border-radius: 4px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Painel do Administrador</h2>

    <p>Digite o código que aparece na TV do cliente:</p>

    <input
        type="number"
        id="codigoTV"
        placeholder="Ex: 7482"
        maxlength="4"
    >

    <button onclick="gerarResposta()">⚡ Gerar Senha</button>

    <div class="resultado" id="areaResultado" style="display:none;">
        <p>Envie esta senha ao cliente:</p>
        <div class="senha-gerada" id="senhaCalculada">----</div>
    </div>
</div>

<script>
    // A MESMA CHAVE SECRETA DO INDEX.HTML
    const CHAVE_SECRETA = 3579;

    function gerarResposta() {
        const codigoTV = parseInt(
            document.getElementById('codigoTV').value
        );

        if (!codigoTV || codigoTV < 1000 || codigoTV > 9999) {
            alert("Digite um código válido de 4 dígitos!");
            return;
        }

        // Aplica a mesma conta matemática
        const resposta = (codigoTV * 3 + CHAVE_SECRETA) % 10000;
        const respostaFormatada = String(resposta).padStart(4, '0');

        document.getElementById('senhaCalculada').innerText =
            respostaFormatada;

        document.getElementById('areaResultado').style.display = 'block';
    }
</script>

</body>
</html>
